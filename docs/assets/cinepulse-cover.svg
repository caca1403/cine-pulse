 <text x="58" y="219" font-size="32" font-weight="700" fill="#f5f7f8">Bir sonraki hikâyen,</text>
 <text x="58" y="261" font-size="32" font-weight="700" fill="#f5f7f8">tek bir ekranda.</text>
 <text x="58" y="308" font-size="17" fill="#abb7c1">Film, dizi, anime ve kişisel kütüphanen.</text>
 <text x="58" y="335" font-size="17" fill="#abb7c1">Keşfet. Kaynağını seç. Devam et.</text>
