<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">CinePulse — keşfet, seç, kaldığın yerden devam et</title>
<desc id="desc">Koyu zemin ve neon yeşil çizgilerle CinePulse tanıtımı; sağda oynatıcı ve kişisel kütüphaneyi temsil eden bir arayüz illüstrasyonu.</desc>
