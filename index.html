<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CinePulse - Modern Sinema & Dizi Platformu</title>
  <!-- CinePulse Anti-Redirect & Anti-Ad Shield -->
  <script defer src="./shield.js"></script>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#05070d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CinePulse" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="dns-prefetch" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons — YEREL KOPYA. Eskiden yalnızca unpkg'ten yükleniyordu;
       APK'da CDN erişimi kesildiğinde ARAYÜZÜN İKONLARI TAMAMEN KAYBOLUYOR
       (logolar/üst bar boş görünüyordu). Artık paketin içinden gelir,
       internetsiz de çalışır; yerel dosya bir şekilde açılamazsa CDN denenir. -->
  <script defer src="./lucide.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/lucide@0.344.0';document.head.appendChild(s);"></script>
  
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- Navbar & Content will be injected dynamically -->
  </div>

  <!-- Player Modal Container -->
  <div id="player-modal" class="modal-backdrop hidden"></div>

  <!-- Trailer Modal Container -->
  <div id="trailer-modal" class="modal-backdrop hidden"></div>

  <!-- Data Backup/Restore JSON Modal Container -->
  <div id="data-modal" class="modal-backdrop hidden"></div>

  <!-- Setup Wizard Modal Container -->
  <div id="setup-wizard-modal" class="modal-backdrop hidden"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
