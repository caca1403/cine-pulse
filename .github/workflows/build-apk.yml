name: Build and Release CinePulse Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          npx cap copy android || true
          node scripts/clean-android-apk.mjs

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Prepare release signing key
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinepulse.keystore"
          test -s "$RUNNER_TEMP/cinepulse.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cinepulse.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cinepulse.apk
          ls -la cinepulse.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinepulse-apk
          path: cinepulse.apk
          retention-days: 14

      - name: Publish to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: CinePulse Mobil Uygulama (${{ github.ref_name }})
          tag_name: ${{ github.ref_name }}
          files: |
            cinepulse.apk
            public/version.json
          draft: false
          prerelease: false
          generate_release_notes: true
